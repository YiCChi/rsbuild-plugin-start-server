name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so upstream releases (Rsbuild via the compat job, Node patch
  # releases via the test matrix) are caught without a push.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false

      # `--no-runtime` keeps the matrix's Node from being replaced by the
      # version `devEngines.runtime` pins for local development.
      - run: pnpm install --frozen-lockfile --no-runtime

      - run: pnpm run typecheck
        working-directory: plugin

      - run: pnpm run lint
        working-directory: plugin

      - run: pnpm exec oxfmt --check

      - run: pnpm run test
        working-directory: plugin

      - run: pnpm run build
        working-directory: plugin

  # The plugin is built against Rsbuild 2 (via Rslib) but declares
  # `@rsbuild/core >=1.5.0` as a peer. Pack it and run it inside real
  # Rsbuild consumers so that open-ended range stays honest.
  compat-rsbuild:
    name: Compat (Rsbuild ${{ matrix.rsbuild-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum declared peer, the newest 1.x release, and the newest release.
        rsbuild-version: ['1.5.0', 'latest-v1', 'latest']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile --no-runtime

      - run: pnpm run build
        working-directory: plugin

      - run: scripts/check-rsbuild-compat.sh ${{ matrix.rsbuild-version }}
